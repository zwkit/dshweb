<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <!-- dshweb 插件列表图标：品牌「全球远程」图形（2026-11-12 用户手绘草图复刻，
        m04653 定稿：删除地球下方的两条单侧箭头，只保留地球并放大居中占据整个图标）。
        风格对齐 DSH 官方插件图标：36x36 圆角渐变瓦片 + 白色线稿。
        同一图形还用于：设置侧栏 SectionIcon、接入页签 NetworkIcon（线稿版）、
        PWA 图标、favicon（assets/pwa/favicon.svg）。 -->
  <defs>
    <linearGradient id="dshweb-remote" x1="18" y1="2" x2="18" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7AC2FF" />
      <stop offset="1" stop-color="#4A65E8" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="32" height="32" rx="8" fill="url(#dshweb-remote)" />
  <g transform="translate(2 2)" fill="none" stroke="#FFFFFF" stroke-width="1.68" stroke-linecap="round" stroke-linejoin="round">
    <!-- 放大居中的大地球：外圈 + 经线椭圆 + 略低于圆心的赤道线（无箭头） -->
    <circle cx="16" cy="16" r="13.5" />
    <ellipse cx="16" cy="16" rx="5.74" ry="13.5" />
    <path d="M2.6 17.9h26.8" />
  </g>
</svg>
